baseURL = 'https://bgailleton.github.io/'
locale = 'en'
title = 'Boris Gailleton'
enableRobotsTXT = true
summaryLength = 30

[module.hugoVersion]
  extended = true
  min = '0.158.0'

[build]
  noJSConfigInAssets = true

[pagination]
  pagerSize = 10

[params]
  tagline = 'Geomorphologist, numerical modeler'
  description = 'Personal site blending research highlights, software documentation, a CV snapshot, and a lightweight blog.'
  background = '#0f0f0f'
  math = true

[params.links]
  github = 'https://github.com/bgailleton'
  bluesky = 'https://bsky.app/profile/bgailleton.bsky.social'
  scholar = 'https://scholar.google.fr/citations?user=r5HIc00AAAAJ&hl=en'
  linkedin = 'https://www.linkedin.com/in/boris-gailleton-46bab8a3/'
  email = 'boris.gailleton@univ-rennes.fr'

[outputs]
home = ['HTML', 'RSS']
section = ['HTML', 'RSS']

[taxonomies]
  tag = 'tags'

[permalinks]
  blog = '/blog/:year/:slug/'

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menu.main]]
    identifier = 'about'
    name = 'About'
    pageRef = '/about'
    weight = 20

  [[menu.main]]
    identifier = 'software'
    name = 'Softwares'
    pageRef = '/software'
    weight = 30

  [[menu.main]]
    identifier = 'publications'
    name = 'Publications'
    pageRef = '/publications'
    weight = 40

  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    pageRef = '/blog'
    weight = 50
