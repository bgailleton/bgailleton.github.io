{{ define "main" }}
  <section class="hero">
    <h1>{{ .Title }}</h1>
    <p>Browse tags that annotate your content.</p>
  </section>

  <div class="card-grid">
    {{ range .Pages }}
      {{ partial "card.html" (dict
        "class" "card"
        "href" .RelPermalink
        "title" .LinkTitle
        "summary" (printf "%d linked entries" (len .Pages))
      ) }}
    {{ end }}
  </div>
{{ end }}
